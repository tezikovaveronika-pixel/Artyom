<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Занятия английским</title>
<style>
:root{
  --blue:#3B8FFF; --blue-d:#1f6fe0; --lime:#C4F233; --ink:#1c1c1e; --grey:#f3f3f5;
  --muted:#6b6b76; --line:#e6e6ec; --coral:#FF6B5B; --yellow:#FFC83D;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--blue);padding:16px;font-family:var(--sans);color:var(--ink);line-height:1.5}
h1,h2,h3{margin:0;line-height:1.1;font-weight:800;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.frame{max-width:1120px;margin:0 auto;background:#fff;border-radius:28px;padding:16px;overflow:hidden}

/* навигация */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--grey);border-radius:20px;padding:8px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{width:40px;height:34px;border-radius:12px;background:var(--lime);display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 22px;font-weight:600;font-size:14px;text-decoration:none;border:0;background:var(--blue);color:#fff}
.pill:hover{background:var(--blue-d)}

/* первый экран */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:center;padding:36px 20px 28px}
.hero h1{font-size:clamp(36px,6.4vw,64px)}
.goal{margin:18px 0 0;max-width:430px;color:var(--muted);font-size:17px}
.goal b{color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--grey);border-radius:999px;padding:6px 6px 6px 22px;text-decoration:none;font-weight:600;font-size:15px}
.btn .go{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px}
.btn.alt .go{background:var(--ink)}
.btn:hover{background:#e9e9ee}
.vis{position:relative;min-height:340px;max-width:460px;width:100%;margin:0 auto}
.vis .lime{position:absolute;right:-50px;top:10px;width:86%;height:86%;background:var(--lime);border-radius:62% 38% 55% 45%;transform:rotate(-16deg)}
.vis .tile{position:absolute;right:26px;top:8px;width:60%;aspect-ratio:1;border-radius:28px;transform:none;
  background:linear-gradient(140deg,#5aa4ff,var(--blue-d));display:grid;place-items:center;text-align:center;color:#fff;
  font-weight:800;font-size:clamp(22px,5.5vw,34px);line-height:1.12;padding:16px}
.note{position:absolute;left:0;bottom:34px;background:var(--grey);border-radius:18px;padding:14px 18px;transform:rotate(-4deg);
  font-weight:600;font-size:14px;max-width:200px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.blob{position:absolute;right:6px;bottom:0;width:104px}

/* синий блок */
.about{background:var(--blue);border-radius:28px;padding:30px 24px 34px;margin-top:6px}
.about h2{color:#fff;font-size:clamp(26px,4vw,38px);margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.fact{background:#fff;border-radius:22px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.fact:nth-child(1){transform:rotate(-2deg)}
.fact:nth-child(2){transform:translateY(18px) rotate(1.5deg)}
.fact:nth-child(3){transform:rotate(-1deg)}
.fact:nth-child(4){transform:translateY(18px) rotate(2deg)}
.fact span{color:var(--muted);font-size:14px}
.fact b{font-size:19px;line-height:1.2}
.shape{width:34px;height:34px;margin-bottom:12px}

/* месяцы */
.months{padding:44px 6px 8px}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.mhead h2{font-size:clamp(28px,4.4vw,42px)}
.mhead p{margin:0;color:var(--muted);font-size:14px}
details.month{background:var(--grey);border-radius:22px;margin-bottom:12px;overflow:hidden;border:2px solid transparent}
details.month[open]{background:#fff;border-color:var(--ink)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px}
summary::-webkit-details-marker{display:none}
.dot{width:26px;height:26px;flex:none}
summary h3{font-size:22px;flex:1}
.count{background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
details[open] .count{background:var(--grey)}
.chev{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.wrap{padding:0 20px 20px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:700;padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.date{white-space:nowrap;font-weight:700}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.badge.yes{background:var(--lime);color:#243300}
.badge.no{background:#ffe1dd;color:#b3321f}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.files img{width:96px;height:96px;object-fit:cover;border-radius:14px;border:2px solid var(--line);display:block}
.file{display:inline-block;padding:6px 12px;border-radius:999px;background:#e8f1ff;color:#0b5aa6;text-decoration:none;font-size:14px;font-weight:600}
.empty{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:14px;padding:26px 0 10px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding:26px 8px 18px}
  .cards{grid-template-columns:1fr 1fr}
  .fact:nth-child(n){transform:none}
  .about{padding:24px 16px}
  .nav .who{display:none}
}
@media (max-width:760px){
  summary{padding:14px}
  .wrap{padding:0 12px 14px}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{background:var(--grey);border-radius:16px;padding:6px 14px;margin-bottom:10px}
  td{border:0;padding:8px 0}
  td::before{content:attr(data-l);display:block;font-weight:700;font-size:13px;color:var(--muted)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="frame">

  <nav class="nav">
    <div class="brand">
      <span class="logo"><svg width="22" height="16" viewBox="0 0 22 16"><circle cx="6" cy="5" r="2" fill="#1c1c1e"/><circle cx="16" cy="5" r="2" fill="#1c1c1e"/><path d="M4 10c3 4 11 4 14 0" fill="none" stroke="#1c1c1e" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span id="tagline"></span>
    </div>
    <a class="pill" id="navConf" target="_blank" rel="noopener">Подключиться к занятию</a>
  </nav>

  <section class="hero">
    <div>
      <h1 id="studentName"></h1>
      <p class="goal"><b>Цель занятий:</b> <span id="goal"></span></p>
      <div class="btns">
        <a class="btn" id="linkConf" target="_blank" rel="noopener">Подключиться к занятию <span class="go">↗</span></a>
        <a class="btn alt" id="linkMiro" target="_blank" rel="noopener">Доска Miro <span class="go">↗</span></a>
      </div>
    </div>
    <div class="vis" aria-hidden="true">
      <div class="lime"></div>
      <div class="tile"><div>Nice to see you again!</div></div>
      <div class="note" id="note"></div>
      <svg class="blob" viewBox="0 0 100 90"><path d="M10 60C4 30 30 6 55 8s42 22 36 48c-4 20-24 30-44 28S14 80 10 60z" fill="#3B8FFF" stroke="#fff" stroke-width="4"/><circle cx="40" cy="42" r="7" fill="#fff"/><circle cx="64" cy="42" r="7" fill="#fff"/><circle cx="42" cy="43" r="3.5" fill="#1c1c1e"/><circle cx="66" cy="43" r="3.5" fill="#1c1c1e"/><path d="M44 60c5 5 12 5 17 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    </div>
  </section>

  <section class="about">
    <h2>Об обучении</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section class="months">
    <div class="mhead">
      <h2>Что проходим</h2>
      <p>Нажмите на месяц, чтобы увидеть все занятия</p>
    </div>
    <div id="months"></div>
  </section>

</div>

<script>
/* ============================================================
   ВСЁ, ЧТО НУЖНО МЕНЯТЬ, НАХОДИТСЯ В ЭТОМ БЛОКЕ
   ============================================================ */
const SITE = {
  tagline: "English сам себя не выучит",
  teacher: "Вероника Константиновна",
  student: "Артем Астафьев",
  goal: "обучение чтению и освоение основ английского языка.",
  grade: "2а",
  subject: "Английский язык",
  schedule: "Пн и Пт, 11:00",
  conferenceUrl: "https://telemost.yandex.ru/j/41613696564383",
  miroUrl: "https://miro.com/welcomeonboard/d3cwQkhRdGJPcDdUMjhLam9kSHFKK25nSHhQOFRCeVpKc01aVnpUMzFqUStnRDBBaU1FTG1xVEJRRXJFZytuUnU0WStTTjhTRy9vSUdHckVCWmJZVWF1UzZ4M0xKYTM0Z0VyemJvYmhTYjdaQWJJQzcydUZld1IrRjdjVkpYZ3FBS2NFMDFkcUNFSnM0d3FEN050ekl3PT0hdjE=?share_link_id=958354347543"
};

/* Занятия. Месяцы создаются сами по дате: появилась дата декабря —
   декабрь сам встанет над ноябрем.
   date: "ГГГГ-ММ-ДД"; paid: true (оплачено) или false (не оплачено).
   Файлы и фото к домашнему заданию: положите их в папку files рядом с
   index.html и впишите имя файла в files: ["фото1.jpg", "задание.pdf"] */
const LESSONS = [
  { date:"2026-11-21", topic:"Подготовка к Олимпиаде",
    homework:{ text:"Аудирование из Олимпиады", files:[] }, paid:true }
];
/* ============================================================ */

const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const COLORS = ["#3B8FFF","#C4F233","#FF6B5B","#FFC83D"];
const IMG = /\.(jpe?g|png|gif|webp|heic)$/i;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,day] = d.split("-"); return `${day}.${m}.${y}`; };
const $ = id => document.getElementById(id);

document.title = SITE.student + " — занятия английским";
$("tagline").textContent = SITE.tagline;
$("studentName").textContent = SITE.student;
$("goal").textContent = SITE.goal;
$("note").textContent = "Занятия: " + SITE.schedule;
$("navConf").href = $("linkConf").href = SITE.conferenceUrl;
$("linkMiro").href = SITE.miroUrl;

const shapes = [
  `<svg class="shape" viewBox="0 0 34 34"><circle cx="9" cy="9" r="8" fill="#FF6B5B"/><circle cx="25" cy="9" r="8" fill="#FF6B5B"/><circle cx="9" cy="25" r="8" fill="#FF6B5B"/><circle cx="25" cy="25" r="8" fill="#FF6B5B"/></svg>`,
  `<svg class="shape" viewBox="0 0 34 34"><rect x="6" y="6" width="22" height="22" rx="3" fill="#2E9C8F" transform="rotate(45 17 17)"/></svg>`,
  `<svg class="shape" viewBox="0 0 34 34"><path d="M17 2l4.5 10 10.5 1-8 7 2.5 11L17 25l-9.5 6L10 20 2 13l10.5-1z" fill="#FFC83D"/></svg>`,
  `<svg class="shape" viewBox="0 0 34 34"><polygon points="11,2 23,2 32,11 32,23 23,32 11,32 2,23 2,11" fill="#3B8FFF"/></svg>`
];
const facts = [["Класс", SITE.grade], ["Предмет", SITE.subject], ["Расписание", SITE.schedule], ["Преподаватель", SITE.teacher]];
$("cards").innerHTML = facts.map(([k,v],i) => `<div class="fact">${shapes[i]}<div><span>${esc(k)}</span><br><b>${esc(v)}</b></div></div>`).join("");

function filesHtml(files){
  if(!files || !files.length) return "";
  return `<div class="files">` + files.map(f => {
    const u = "files/" + encodeURIComponent(f);
    return IMG.test(f)
      ? `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${esc(f)}" loading="lazy"></a>`
      : `<a class="file" href="${u}" target="_blank" rel="noopener">${esc(f)}</a>`;
  }).join("") + `</div>`;
}

const groups = {};
LESSONS.forEach(l => (groups[l.date.slice(0,7)] ||= []).push(l));
const keys = Object.keys(groups).sort().reverse();
const box = $("months");
if(!keys.length) box.innerHTML = `<p class="empty">Занятий пока нет.</p>`;

keys.forEach((k, i) => {
  const [y, m] = k.split("-");
  const rows = groups[k].sort((a,b) => a.date.localeCompare(b.date)).map(l => {
    const hw = l.homework || {};
    const hwText = hw.text ? esc(hw.text) : (hw.files && hw.files.length ? "" : `<span class="empty">—</span>`);
    return `<tr>
      <td class="date" data-l="Дата">${fmt(l.date)}</td>
      <td data-l="Тема">${esc(l.topic)}</td>
      <td data-l="Домашнее задание">${hwText}${filesHtml(hw.files)}</td>
      <td data-l="Оплата"><span class="badge ${l.paid?"yes":"no"}">${l.paid?"Оплачено":"Не оплачено"}</span></td>
    </tr>`;
  }).join("");
  const n = groups[k].length;
  const word = n%10===1&&n%100!==11 ? "занятие" : (n%10>=2&&n%10<=4&&(n%100<10||n%100>=20) ? "занятия" : "занятий");
  const d = document.createElement("details");
  d.className = "month";
  if(i === 0) d.open = true;
  d.innerHTML = `<summary>
      <svg class="dot" viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="${COLORS[(keys.length-1-i)%COLORS.length]}"/></svg>
      <h3>${MONTHS[+m-1]} ${y}</h3>
      <span class="count">${n} ${word}</span>
      <span class="chev" aria-hidden="true">▾</span>
    </summary>
    <div class="wrap"><table>
      <thead><tr><th>Дата</th><th>Тема</th><th>Домашнее задание</th><th>Оплата</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  box.appendChild(d);
});
</script>
</body>
</html>
